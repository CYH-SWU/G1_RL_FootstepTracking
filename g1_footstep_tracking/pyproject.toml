[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "g1_footstep_tracking"
version = "0.1.0"
description = "G1 footstep tracking task for Isaac Lab"
readme = "README.md"
requires-python = ">=3.10"
license = {text = "BSD-3-Clause"}
authors = [
    {name = "Your Name", email = "you@example.com"},
]
dependencies = [
    "isaaclab",
]

[project.optional-dependencies]
dev = [
    "pre-commit",
    "pytest",
]

# 关键：告诉 setuptools 从哪里找到包
[tool.setuptools.package-dir]
"" = "source/g1_footstep_tracking"

[tool.setuptools.packages.find]
where = ["source/g1_footstep_tracking"]
include = ["g1_footstep_tracking*"]
